name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-latest]
        python: ['3.7', '3.9', '3.12']
    runs-on: ${{ matrix.os }}
    env:
      DCC_MCP_DISABLE_DEFAULT_SKILL_PATHS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e '.[dev]'
      - run: python -m pytest -q -m 'not dcc'
      - run: python -m ruff check src tests tools
      - run: python -m ruff format --check src tests tools
  wheel:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install build
      - run: python -m build
      - run: python tools/verify_wheel.py dist

  linux-native:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install official stable Inkscape and owned test display
        run: |
          sudo add-apt-repository --yes ppa:inkscape.dev/stable
          sudo apt-get update
          sudo apt-get install --yes inkscape xvfb python3-lxml python3-cssselect python3-tinycss2 python3-numpy poppler-utils fonts-dejavu-core adwaita-icon-theme-full librsvg2-common
          inkscape --version
      - run: python -m pip install -e '.[dev]'
      - name: Native build, save, reopen and transparent PNG proof
        env:
          DCC_MCP_INKSCAPE_LIVE_TEST: '1'
          DCC_MCP_INKSCAPE_EXE: /usr/bin/inkscape
        run: |
          export XDG_CONFIG_HOME="$RUNNER_TEMP/inkscape-native-config"
          mkdir -p "$XDG_CONFIG_HOME/gtk-3.0"
          printf '[Settings]\ngtk-icon-theme-name=Adwaita\ngtk-theme-name=Adwaita\n' > "$XDG_CONFIG_HOME/gtk-3.0/settings.ini"
          controller_python="$(command -v python)"
          PATH="/usr/bin:$PATH" xvfb-run -a "$controller_python" -m pytest tests/test_native_inkscape.py -q -m dcc --basetemp=native-evidence
      - name: Install pinned official CLI for typed gateway regression
        run: python -m pip install dcc-mcp-cli==0.20.42
      - name: Real layered vector regression through gateway
        run: |
          export XDG_CONFIG_HOME="$RUNNER_TEMP/inkscape-native-config"
          controller_python="$(command -v python)"
          PATH="/usr/bin:$PATH" xvfb-run -a "$controller_python" tools/native_vector_regression.py --plans tests/fixtures/night_atlas --output "$RUNNER_TEMP/night-atlas-regression"
      - name: Preserve native vector review artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: night-atlas-native-review
          path: |
            ${{ runner.temp }}/night-atlas-regression/artwork
            ${{ runner.temp }}/night-atlas-regression/evidence
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 7
      - name: Preserve native invocation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: linux-native-evidence
          path: native-evidence
          include-hidden-files: true
          retention-days: 7
